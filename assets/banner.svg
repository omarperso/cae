<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claude Agent Everywhere banner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121722"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="bacc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6fbcff"/>
      <stop offset="1" stop-color="#3a7bff"/>
    </linearGradient>
    <radialGradient id="bglow" cx="980" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a7bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3a7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bbg)"/>
  <rect width="1280" height="360" fill="url(#bglow)"/>

  <!-- faint grid -->
  <g stroke="#1b2330" stroke-width="1" opacity="0.6">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- text -->
  <text x="90" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#eef3fa">Claude Agent <tspan fill="#6fbcff">Everywhere</tspan></text>
  <text x="92" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb0c3">Control any computer on your network from your main Claude — in plain language.</text>

  <!-- chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    <g>
      <rect x="92" y="246" width="190" height="44" rx="22" fill="#15202f" stroke="#2b3a4f"/>
      <text x="187" y="274" text-anchor="middle" fill="#cfe0f2">one-command setup</text>
    </g>
    <g>
      <rect x="298" y="246" width="150" height="44" rx="22" fill="#15202f" stroke="#2b3a4f"/>
      <text x="373" y="274" text-anchor="middle" fill="#cfe0f2">live view</text>
    </g>
    <g>
      <rect x="464" y="246" width="210" height="44" rx="22" fill="#15202f" stroke="#2b3a4f"/>
      <text x="569" y="274" text-anchor="middle" fill="#cfe0f2">control many at once</text>
    </g>
  </g>

  <!-- network motif on the right -->
  <g transform="translate(980,180)">
    <g stroke="url(#bacc)" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="-95" y2="-90"/>
      <line x1="0" y1="0" x2="110" y2="-70"/>
      <line x1="0" y1="0" x2="-110" y2="80"/>
      <line x1="0" y1="0" x2="100" y2="95"/>
    </g>
    <g fill="#141c29" stroke="url(#bacc)" stroke-width="4">
      <rect x="-130" y="-116" width="70" height="52" rx="9"/>
      <rect x="78" y="-98" width="70" height="52" rx="9"/>
      <rect x="-146" y="56" width="70" height="52" rx="9"/>
      <rect x="64" y="70" width="70" height="52" rx="9"/>
    </g>
    <circle cx="0" cy="0" r="46" fill="#0e1420" stroke="url(#bacc)" stroke-width="5"/>
    <circle cx="0" cy="0" r="19" fill="url(#bacc)"/>
  </g>
</svg>
